<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フラッシュリング</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        /* ーーー 新設：絶対にエラーが起きない入力設定エリア ーーー */
        .config-panel {
            background-color: #111111;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            width: 100%;
            box-sizing: border-box;
        }
        .config-title {
            margin: 0 0 12px 0;
            font-size: 1rem;
            font-weight: bold;
            color: #aaaaaa;
            border-bottom: 1px solid #222222;
            padding-bottom: 4px;
        }
        .config-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .config-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .config-group label {
            font-size: 0.8rem;
            color: #888888;
            font-weight: bold;
        }
        .config-group input {
            background-color: #222222;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .config-sub-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }
        .config-sub-grid div {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.85rem;
            color: #cccccc;
        }
        .config-sub-grid input {
            width: 100%;
            padding: 4px;
        }

        /* ボタン・URL枠エリア */
        .btn-area {
            text-align: center;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .ready-btn {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(255,255,255,0.1);
        }
        .ready-btn:hover { background-color: #cccccc; }
        
        .url-box-container {
            background-color: #1a1a1a;
            border: 1px solid #444444;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
        }
        .url-box-container p { margin: 0 0 6px 0; font-size: 0.85rem; color: #ff9900; font-weight: bold; }
        .url-field {
            width: 100%;
            background-color: #000000;
            border: 1px solid #555555;
            color: #00ffcc;
            padding: 8px;
            font-size: 0.9rem;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .time-counter { text-align: center; font-size: 0.85rem; color: #ff3b30; margin-top: 5px; font-weight: bold; }

        /* ーーー 試合画面のレイアウト ーーー */
        .match-display {
            border-top: 2px dashed #333333;
            padding-top: 30px;
            margin-top: 10px;
            width: 100%;
        }
        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .player-header {
            font-size: 1.8rem;
            margin: 0;
            font-weight: bold;
            min-width: 120px;
        }
        .turn-details {
            text-align: center;
            font-size: 0.9rem;
        }

        .battle-area {
            display: grid;
            grid-template-columns: 1fr 1.6fr 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 30px;
        }

        .status-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 1.3rem;
            font-weight: bold;
            line-height: 1.6;
        }
        .status-list li { margin-bottom: 6px; }
        .status-val { display: inline-block; min-width: 20px; text-align: center; color: #00ffcc; }

        .action-log { display: flex; flex-direction: column; gap: 12px; }
        .action-row {
            display: grid;
            grid-template-columns: 65px 35px 60px 35px 65px;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
        }
        .damage-pop { font-size: 0.75rem; color: #ccc; white-space: nowrap; }
        .left-dmg { text-align: left; }
        .right-dmg { text-align: right; }
        .left-num { text-align: right; padding-right: 5px; }
        .right-num { text-align: left; padding-left: 5px; }

        .dice-log-area {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #bbb;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .total-damage-section { text-align: center; margin-bottom: 30px; }
        .damage-title { font-size: 1.3rem; margin-bottom: 5px; font-weight: bold; }
        .damage-scores { display: flex; justify-content: space-around; font-size: 3.5rem; font-weight: bold; }

        .winner-announce { text-align: center; font-size: 2.5rem; font-weight: bold; margin-top: 10px; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <h1>フラッシュリング</h1>

    <!-- 🛠 安全な入力パネル（ここに入力されたものが下の画面とURLに確実に反映されます） -->
    <div class="config-panel">
        <p class="config-title">⚙️ 試合条件の設定（ここに入力してください）</p>
        
        <div class="config-row">
            <div class="config-group">
                <label>ターン数</label>
                <input type="number" id="inTurn" value="4">
            </div>
            <div class="config-group">
                <label>自動ダイス実行時刻</label>
                <input type="text" id="inTime" value="2026/08/23/23:00" placeholder="YYYY/MM/DD/HH:MM">
            </div>
        </div>

        <div class="config-row">
            <!-- 選手A -->
            <div class="config-group">
                <label>選手A の名前</label>
                <input type="text" id="inNameA" value="選手A">
                <label style="margin-top:5px;">ステータス</label>
                <div class="config-sub-grid">
                    <div>打撃:<input type="number" id="inSA1" value="6"></div>
                    <div>関節:<input type="number" id="inSA2" value="4"></div>
                    <div>投げ:<input type="number" id="inSA3" value="3"></div>
                    <div>飛び:<input type="number" id="inSA4" value="3"></div>
                    <div>締め:<input type="number" id="inSA5" value="3"></div>
                    <div>性的:<input type="number" id="inSA6" value="1"></div>
                </div>
            </div>
            <!-- 選手B -->
            <div class="config-group">
                <label>選手B の名前</label>
                <input type="text" id="inNameB" value="選手B">
                <label style="margin-top:5px;">ステータス</label>
                <div class="config-sub-grid">
                    <div>打撃:<input type="number" id="inSB1" value="3"></div>
                    <div>関節:<input type="number" id="inSB2" value="4"></div>
                    <div>投げ:<input type="number" id="inSB3" value="2"></div>
                    <div>飛び:<input type="number" id="inSB4" value="4"></div>
                    <div>締め:<input type="number" id="inSB5" value="1"></div>
                    <div>性的:<input type="number" id="inSB6" value="6"></div>
                </div>
            </div>
        </div>

        <!-- ボタンとURL表示枠 -->
        <div class="btn-area">
            <button class="ready-btn" onclick="generateShareURL()">試合準備OK！ URLを発行する</button>
            <div class="url-box-container">
                <p>▼ 生成された専用URL（トリプルクリックで全選択できます）：</p>
                <input type="text" class="url-field" id="urlField" value="設定を完了して上のボタンを押してください" readonly onclick="this.select();">
                <div class="time-counter" id="timeCounterNotice"></div>
            </div>
        </div>
    </div>


    <!-- ーーー ここから下は実際の試合画面表示 ーーー -->
    <div class="match-display">
        <div class="match-info">
            <h2 class="player-header" id="dispNameA">選手A</h2>
            <div class="turn-details">
                <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 4px;">
                    ターン数 <span id="dispTurn">4</span>
                </div>
                <div id="dispTime">2026/08/23/23:00</div>
                <div id="headerDiceResult">4d6=?</div>
            </div>
            <h2 class="player-header" style="text-align: right;" id="dispNameB">選手B</h2>
        </div>

        <div class="battle-area">
            <!-- 左ステータス -->
            <ul class="status-list">
                <li>打撃 <span class="status-val" id="dispSA1">6</span></li>
                <li>関節 <span class="status-val" id="dispSA2">4</span></li>
                <li>投げ <span class="status-val" id="dispSA3">3</span></li>
                <li>飛び <span class="status-val" id="dispSA4">3</span></li>
                <li>締め <span class="status-val" id="dispSA5">3</span></li>
