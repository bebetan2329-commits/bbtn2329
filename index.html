<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フラッシュリング</title>
    <style>
        /* 全体の背景と文字色（画像を再現） */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* タイトルエリア */
        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* 「試合準備OK！」ボタンとURL出力エリアのスタイル */
        .setup-area {
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .ready-btn {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .ready-btn:hover {
            background-color: #cccccc;
        }
        .url-output {
            background-color: #111111;
            border: 1px solid #333333;
            color: #00ffcc;
            padding: 8px;
            width: 100%;
            font-size: 0.85rem;
            word-break: break-all;
            border-radius: 4px;
            display: none;
        }

        /* 試合情報・ヘッダー */
        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        /* 編集可能な場所のスタイル（4つのポイントのみ） */
        .editable {
            cursor: pointer;
            border-bottom: 1px dashed #555;
        }
        .editable:focus {
            background-color: #222;
            outline: none;
            border-bottom: 1px solid #fff;
        }

        .player-header {
            font-size: 1.8rem;
            margin: 0;
            font-weight: bold;
            display: inline-block;
            min-width: 100px;
        }
        .turn-details {
            text-align: center;
            font-size: 0.9rem;
        }

        /* メインの対戦エリア（3分割） */
        .battle-area {
            display: grid;
            grid-template-columns: 1fr 1.6fr 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 30px;
        }

        .status-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 1.3rem;
            font-weight: bold;
            line-height: 1.6;
        }
        .status-list li {
            margin-bottom: 6px;
        }
        .status-val {
            display: inline-block;
            min-width: 20px;
            text-align: center;
        }

        /* 中央の行動ログ（技名が完全に一直線になるよう列幅を固定） */
        .action-log {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .action-row {
            display: grid;
            grid-template-columns: 65px 35px 60px 35px 65px;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
        }
        .damage-pop {
            font-size: 0.75rem;
            color: #ccc;
            white-space: nowrap;
        }
        .left-dmg { text-align: left; }
        .right-dmg { text-align: right; }
        .left-num { text-align: right; padding-right: 5px; }
        .right-num { text-align: left; padding-left: 5px; }

        /* ダイスのログエリア */
        .dice-log-area {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #bbb;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* 与えたダメージ */
        .total-damage-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .damage-title {
            font-size: 1.3rem;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .damage-scores {
            display: flex;
            justify-content: space-around;
            font-size: 3.5rem;
            font-weight: bold;
        }

        /* 勝者アナウンス */
        .winner-announce {
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* カウントダウン表示（確認用） */
        .timer-status {
            text-align: center;
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>フラッシュリング</h1>

    <!-- 試合情報 -->
    <div class="match-info">
        <!-- 編集ポイント①：選手Aの名前 -->
        <h2 class="player-header"><span class="editable" id="nameA" contenteditable="true">選手A</span></h2>
        
        <div class="turn-details">
            <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 4px;">
                <!-- 編集ポイント③：ターン数 -->
                ターン数 <span class="editable" contenteditable="true" id="turnNum">4</span>
            </div>
            <!-- 編集ポイント④：ダイスが振られる時刻設定 -->
            <div class="editable" contenteditable="true" id="targetTime">2026/08/23/23:00</div>
            <!-- ターン数に応じたダイス結果が記録される場所 -->
            <div id="headerDiceResult">4d6=2,1,6,3</div>
        </div>

        <!-- 編集ポイント①：選手Bの名前 -->
        <h2 class="player-header" style="text-align: right;"><span class="editable" id="nameB" contenteditable="true">選手B</span></h2>
    </div>

    <!-- 新設：試合準備OKボタンエリア -->
    <div class="setup-area">
        <button class="ready-btn" onclick="generateShareURL()">試合準備OK！</button>
        <div class="url-output" id="urlOutput" onclick="this.select();"></div>
    </div>

    <!-- カウントダウン用タイマー -->
    <div class="timer-status" id="timerStatus">タイマー待機中...</div>

    <!-- メイン対戦エリア -->
    <div class="battle-area">
        <!-- 左：選手Aステータス（編集ポイント②：数値のみ編集可能） -->
        <ul class="status-list">
            <li>打撃 <span class="editable status-val" id="statA_1" contenteditable="true">6</span></li>
            <li>関節 <span class="editable status-val" id="statA_2" contenteditable="true">4</span></li>
            <li>投げ <span class="editable status-val" id="statA_3" contenteditable="true">3</span></li>
            <li>飛び <span class="editable status-val" id="statA_4" contenteditable="true">3</span></li>
            <li>締め <span class="editable status-val" id="statA_5" contenteditable="true">3</span></li>
            <li>性的 <span class="editable status-val" id="statA_6" contenteditable="true">1</span></li>
        </ul>

        <!-- 中央：ターン行動ログ -->
        <div class="action-log" id="actionLogContainer">
            <div style="text-align:center; color:#555; font-size:1rem; grid-column:span 5;">設定時刻を過ぎると結果が表示されます</div>
        </div>

        <!-- 右：選手Bステータス（編集ポイント②：数値のみ編集可能） -->
        <ul class="status-list" style="text-align: right;">
            <li>打撃 <span class="editable status-val" id="statB_1" contenteditable="true">3</span></li>
            <li>関節 <span class="editable status-val" id="statB_2" contenteditable="true">4</span></li>
            <li>投げ <span class="editable status-val" id="statB_3" contenteditable="true">2</span></li>
            <li>飛び <span class="editable status-val" id="statB_4" contenteditable="true">4</span></li>
            <li>締め <span class="editable status-val" id="statB_5" contenteditable="true">1</span></li>
            <li>性的 <span class="editable status-val" id="statB_6" contenteditable="true">6</span></li>
        </ul>
    </div>

    <!-- ダイス詳細ログ -->
    <div class="dice-log-area">
        <div id="diceLogA" style="white-space: pre-line;"></div>
        <div id="diceLogB" style="text-align: right; white-space: pre-line;"></div>
    </div>

    <!-- 与えたダメージ（合計値の自動計算） -->
    <div class="total-damage-section">
        <div class="damage-title">与えたダメージ</div>
        <div class="damage-scores">
            <span id="totalDmgA">0</span>
            <span id="totalDmgB">0</span>
        </div>
    </div>

    <!-- 勝敗 -->
    <div class="winner-announce" id="winnerDiv"><span id="winnerName">---</span>の勝利！</div>
</div>

<script>
    const skillNames = { 1: "打撃", 2: "関節", 3: "投げ", 4: "飛び", 5: "締め", 6: "性的" };

    // 固定シード値（乱数生成器用）
    function mulberry32(a) {
        return function() {
          let t = a += 0x6D2B79F5;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        }
    }

    let randomFunc = Math.random;

    // シード値付きダイスロール関数
    function rollDiceSeeded(count) {
        let results = [];
        let total = 0;
        for (let i = 0; i < count; i++) {
            let roll = Math.floor(randomFunc() * 6) + 1;
            results.push(roll);
            total += roll;
        }
        return { results, total };
    }

    function parseTargetTime(str) {
        const parts = str.trim().split(/[\/\:]/);
        if (parts.length < 5) return null;
        return new Date(parts[0], parts[1] - 1, parts[2], parts[3], parts[4], 0);
    }

    // --- 【新機能】現在の設定値からURL（パラメータ付き）を生成する機能 ---
    function generateShareURL() {
        const params = new URLSearchParams();
        params.set('nA', document.getElementById('nameA').innerText.trim());
        params.set('nB', document.getElementById('nameB').innerText.trim());
        params.set('tN', document.getElementById('turnNum').innerText.trim());
